[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phd-search-copilot-agent"
version = "2.0.0"
description = "Autonomous, human-supervised AI agent for PhD discovery, verification, ranking, supervisor research, application preparation, interview prep, and outcome tracking."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Saeedam02"}
]
keywords = [
  "phd",
  "academic-job-search",
  "ai-agent",
  "openai",
  "chatgpt",
  "research",
  "graduate-school",
  "automation"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "openai-agents>=0.22.0,<0.23",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.12",
  "mypy>=1.17"
]

[project.scripts]
phd-agent = "phd_search_agent.cli:app"

[project.urls]
Homepage = "https://github.com/Saeedam02/phd-search-copilot"
Repository = "https://github.com/Saeedam02/phd-search-copilot"
Issues = "https://github.com/Saeedam02/phd-search-copilot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phd_search_agent = ["agent_prompts/*.md", "defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.coverage.run]
branch = true
source = ["phd_search_agent"]
omit = [
  "src/phd_search_agent/agent_runtime.py",
  "src/phd_search_agent/cli.py"
]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_return_any = true
ignore_missing_imports = true
